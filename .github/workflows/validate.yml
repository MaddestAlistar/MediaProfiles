name: Validate media preference scores
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: "python3 -m unittest discover -s tests -v"
      - run: "python3 scripts/score_releases.py --profile balanced-4k"
      - run: "python3 scripts/score_releases.py --profile storage-saver"
      - run: "python3 scripts/score_releases.py --profile remux-first"
